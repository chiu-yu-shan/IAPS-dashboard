<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IAPS Accelerator OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap');
:root{
  --bg:#f6f7f9;
  --panel:#ffffff;
  --ink:#111827;
  --ink-2:#374151;
  --muted:#6b7280;
  --faint:#9ca3af;
  --line:#e5e7eb;
  --line-2:#f3f4f6;
  --blue:#1d4ed8;
  --blue-mid:#2563eb;
  --blue-lt:#eff6ff;
  --blue-border:#bfdbfe;
  --green:#059669;
  --green-lt:#ecfdf5;
  --orange:#d97706;
  --orange-lt:#fffbeb;
  --purple:#6d28d9;
  --purple-lt:#f5f3ff;
  --cyan:#0891b2;
  --cyan-lt:#ecfeff;
  --red:#dc2626;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.03);
  --shadow-md:0 4px 12px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04);
  --shadow-hover:0 8px 24px rgba(0,0,0,.09);
  --radius:12px;
  --radius-sm:8px;
}
*{box-sizing:border-box}
html{font-size:14px}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.5;
  letter-spacing:-.006em;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}

/* ─── TOPBAR ─── */
.topbar{
  height:56px;background:#0f172a;color:#fff;
  display:flex;align-items:center;gap:16px;padding:0 20px;
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.topbar::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#3b82f6 0%,#6366f1 50%,#8b5cf6 100%);
}
.logo{
  font-weight:700;font-size:14px;letter-spacing:-.01em;
  color:#fff;white-space:nowrap;display:flex;align-items:center;gap:10px;
}
.logo:before{
  content:'';display:inline-block;
  width:26px;height:26px;border-radius:7px;flex-shrink:0;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
}
.dot{display:none}
.global-search{
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:var(--radius-sm);color:#fff;padding:8px 12px;
  min-width:320px;outline:none;font-size:13px;
  transition:border-color .15s,background .15s;
}
.global-search::placeholder{color:rgba(255,255,255,.3)}
.global-search:focus{background:rgba(255,255,255,.1);border-color:rgba(99,102,241,.6)}
.refresh{
  margin-left:auto;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius-sm);padding:7px 14px;cursor:pointer;
  font-size:12px;font-weight:600;letter-spacing:.01em;transition:.15s;
}
.refresh:hover{background:rgba(255,255,255,.17)}
.export-btn{
  background:rgba(255,255,255,.1);color:#e0e7ff;border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius-sm);padding:7px 14px;cursor:pointer;
  font-size:12px;font-weight:600;transition:.15s;
}
.export-btn:hover{background:rgba(255,255,255,.17)}

/* ─── SIDEBAR ─── */
.layout{display:flex}
.sidebar{
  width:224px;background:var(--panel);border-right:1px solid var(--line);
  min-height:calc(100vh - 56px);padding:14px 10px;
  position:sticky;top:56px;overflow-y:auto;flex-shrink:0;
}
.side-title{
  font-size:10px;color:var(--faint);margin:16px 10px 5px;
  font-weight:600;text-transform:uppercase;letter-spacing:.08em;
}
.side-title:first-child{margin-top:4px}
.nav{
  width:100%;display:flex;align-items:center;gap:9px;
  background:transparent;border:0;border-radius:var(--radius-sm);
  padding:8px 11px;margin:1px 0;color:var(--muted);
  font-weight:500;font-size:13px;cursor:pointer;text-align:left;
  transition:background .13s,color .13s;white-space:nowrap;
}
.nav:hover{background:var(--bg);color:var(--ink-2)}
.nav.active{background:var(--blue-lt);color:var(--blue);font-weight:600}
.nav-group{margin-bottom:2px}

/* ─── MAIN ─── */
.main{flex:1;padding:24px 28px;min-width:0;max-width:1380px;margin:0 auto}
.page{display:none}.page.active{display:block}
.detail{display:none}.detail.active{display:block}

/* ─── PAGE HEADER ─── */
.page-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:20px;gap:12px;flex-wrap:wrap;
}
.page-title{font-size:18px;font-weight:700;margin:0;letter-spacing:-.02em;color:var(--ink)}
.subtitle{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:400}

/* ─── CARD ─── */
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);
}
.p16{padding:16px}

/* ─── GRIDS ─── */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

/* ─── KPI CARDS ─── */
.kpi{
  min-height:92px;display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;
}
.kpi::after{
  content:'';position:absolute;top:16px;right:16px;
  width:34px;height:34px;border-radius:10px;background:var(--blue-lt);
}
.kpi.green::after{background:var(--green-lt)}
.kpi.orange::after{background:var(--orange-lt)}
.kpi.cyan::after{background:var(--cyan-lt)}
.kpi small{
  font-size:11.5px;color:var(--muted);font-weight:500;
  text-transform:uppercase;letter-spacing:.04em;
}
.kpi .num{
  font-size:26px;font-weight:700;margin-top:6px;
  letter-spacing:-.03em;color:var(--ink);line-height:1.1;
}
.kpi.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s}
.kpi.clickable:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}

/* ─── SECTIONS ─── */
.section{margin-top:16px}
.section h3{
  font-size:13px;margin:0 0 12px;font-weight:600;
  color:var(--ink-2);letter-spacing:-.005em;
}

/* ─── LIST ROWS ─── */
.list-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg);padding:10px 12px;border-radius:var(--radius-sm);
  margin:6px 0;cursor:pointer;border:1px solid transparent;
  font-size:13px;transition:.12s;
}
.list-row:hover{background:var(--blue-lt);border-color:var(--blue-border)}
.list-row .date{font-size:11.5px;color:var(--muted)}

/* ─── BAR CHART ─── */
.bar-row{
  display:grid;grid-template-columns:108px 1fr 42px;
  align-items:center;gap:10px;margin:9px 0;font-size:12.5px;
}
.bar-bg{height:7px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--blue-mid);border-radius:99px;transition:width .5s}

/* ─── TREEMAP ─── */
.treemap{display:flex;flex-wrap:wrap;gap:6px;min-height:200px}
.tile{
  min-width:110px;min-height:64px;flex:1 1 140px;
  border-radius:var(--radius-sm);color:#fff;padding:10px;
  font-size:11.5px;font-weight:600;
  display:flex;align-items:flex-end;justify-content:flex-end;
  text-align:right;cursor:pointer;overflow:hidden;
  transition:filter .15s,transform .15s;
}
.tile:hover{filter:brightness(.95);transform:translateY(-1px)}

/* ─── YEAR CHART ─── */
.yr-chart{display:flex;align-items:flex-end;gap:9px;height:160px;overflow-x:auto;padding:4px 2px 0}
.yr-col{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:40px}
.yr-num{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.yr-bar{
  width:24px;background:linear-gradient(180deg,#60a5fa 0%,#1d4ed8 100%);
  border-radius:5px 5px 2px 2px;min-height:4px;transition:height .4s;
}
.yr-lbl{font-size:10.5px;color:var(--muted);font-weight:500}

/* ─── FILTERS ─── */
.filters{
  display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 14px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.field label{
  display:block;font-size:11px;font-weight:600;margin:0 0 5px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
}
.field input,.field select,.multi-btn{
  height:36px;border:1px solid var(--line);background:var(--bg);
  border-radius:var(--radius-sm);padding:0 10px;min-width:136px;
  color:var(--ink-2);outline:none;font-size:13px;
  transition:border-color .13s;
}
.field input{min-width:220px}
.field input:focus,.field select:focus{border-color:var(--blue-mid);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.btn{
  height:36px;border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:0 14px;background:var(--panel);color:var(--ink-2);
  font-size:13px;font-weight:500;cursor:pointer;transition:.13s;
}
.btn:hover{background:var(--bg);border-color:var(--blue-border);color:var(--blue)}
.btn.primary{background:var(--blue-mid);color:#fff;border-color:var(--blue-mid)}
.btn.primary:hover{background:var(--blue)}
.toggle{margin-left:auto;display:flex;gap:8px}
.view-toolbar{display:flex;justify-content:flex-end;gap:8px;margin:0 0 10px}
.bulk-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin:-4px 0 14px;box-shadow:var(--shadow)}

/* ─── MULTI SELECT ─── */
.multi{position:relative}
.multi-btn{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;cursor:pointer;font-weight:500;background:var(--bg);
}
.multi-btn:hover{border-color:var(--blue-border)}
.multi-menu{
  display:none;position:absolute;z-index:50;top:42px;left:0;
  width:260px;max-height:280px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:7px;
  box-shadow:0 16px 40px rgba(0,0,0,.12);
}
.multi.open .multi-menu{display:block}
.multi-menu label{
  display:flex!important;align-items:center;gap:8px;padding:7px 9px;
  border-radius:6px;white-space:normal;font-size:13px;
  color:var(--ink-2);cursor:pointer;
}
.multi-menu label:hover{background:var(--bg)}
.multi-menu input[type="checkbox"]{
  width:14px!important;height:14px!important;min-width:14px!important;
  margin:0!important;flex-shrink:0!important;appearance:auto!important;
}

/* ─── TABLE ─── */
.table-wrap{
  overflow:auto;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);box-shadow:var(--shadow);
}
.table{width:100%;border-collapse:collapse;min-width:1020px}
.table th{
  padding:10px 14px;text-align:left;
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.04em;color:var(--muted);
  background:var(--bg);border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.table td{
  padding:12px 14px;font-size:13px;color:var(--ink-2);
  border-bottom:1px solid var(--line-2);vertical-align:top;
}
.table tr:last-child td{border-bottom:none}
.table tbody tr{cursor:pointer;transition:background .1s}
.table tbody tr:hover td{background:var(--bg)}

/* ─── STARTUP CARDS ─── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.startup-card{padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.startup-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--blue-border)}
.card-title{font-size:14px;font-weight:650;margin-bottom:6px;letter-spacing:-.01em;color:var(--ink)}
.desc{
  color:var(--muted);line-height:1.6;font-size:12.5px;
  margin:7px 0 11px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{
  display:inline-flex;align-items:center;border-radius:5px;
  background:var(--blue-lt);color:var(--blue);
  font-size:11.5px;font-weight:500;padding:3px 8px;line-height:1;
}
.tag.premium{background:var(--orange-lt);color:var(--orange)}
.tag.level{background:var(--purple-lt);color:var(--purple)}
.tag.market{background:var(--green-lt);color:var(--green)}
.tag.service{background:var(--orange-lt);color:var(--orange)}
.tag.impact{background:var(--green-lt);color:var(--green);font-weight:600}
.tag.zero{background:var(--bg);color:var(--faint)}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:10px}
.arrow{color:var(--blue);font-weight:600}
.empty{padding:40px;color:var(--faint);text-align:center;font-size:13px}

/* ─── DETAIL PAGE ─── */
.detail-hero{
  display:flex;justify-content:space-between;gap:16px;padding:20px;
}
.detail-title{font-size:18px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
.kv{margin:0 0 14px}
.kv b{
  display:block;font-size:10.5px;color:var(--muted);margin-bottom:4px;
  font-weight:600;text-transform:uppercase;letter-spacing:.04em;
}
.kv div{font-size:13px;line-height:1.65;color:var(--ink-2)}
.back{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:8px 13px;cursor:pointer;
  font-weight:500;font-size:13px;color:var(--ink-2);transition:.13s;
}
.back:hover{border-color:var(--blue-border);color:var(--blue)}
.edit{
  background:var(--orange-lt);border:1px solid #fed7aa;color:var(--orange);
  border-radius:var(--radius-sm);padding:8px 13px;cursor:pointer;
  font-weight:500;font-size:13px;
}

/* ─── PARTNER CARDS ─── */
.partner-card{padding:16px;cursor:pointer;transition:.15s}
.partner-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.partner-card .name{font-weight:600;margin-bottom:6px;font-size:14px;color:var(--ink)}
.muted{color:var(--muted);font-size:12.5px;line-height:1.55}
.category-panel{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.category-chip{
  border:1px solid var(--line);background:var(--panel);border-radius:99px;
  padding:7px 13px;font-weight:500;font-size:12.5px;cursor:pointer;color:var(--ink-2);
  transition:.13s;
}
.category-chip.active,.category-chip:hover{background:var(--blue-lt);color:var(--blue);border-color:var(--blue-border)}
.partner-avatar{
  width:48px;height:48px;border-radius:12px;background:var(--blue-lt);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:var(--blue);
}
.partner-hero{display:flex;gap:14px;align-items:flex-start}

/* ─── ADAPT TABLE ─── */
.adapt-table{width:100%;border-collapse:collapse}
.adapt-table th{
  text-align:left;font-size:10.5px;color:var(--muted);font-weight:600;
  padding:9px 11px;border-bottom:1px solid var(--line);background:var(--bg);
  text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;
}
.adapt-table td{padding:11px;border-bottom:1px solid var(--line-2);font-size:12.5px;vertical-align:top}
.adapt-table tr:last-child td{border-bottom:none}
.adapt-table tr:hover td{background:var(--bg)}
.adapt-name{color:var(--blue);font-weight:600;cursor:pointer}
.adapt-name:hover{text-decoration:underline}
.adapt-score{font-weight:700;color:var(--blue);text-align:right}
.detail-side .kv:last-child{margin-bottom:0}

/* ─── SIMILAR CARDS ─── */
.similar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin-top:9px}
.similar-card{
  border:1px solid var(--line);background:var(--bg);
  border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:.13s;
}
.similar-card:hover{background:var(--blue-lt);border-color:var(--blue-border)}
.similar-card .sim-name{font-weight:600;font-size:13px;margin-bottom:5px;color:var(--ink)}
.similar-card .sim-score{font-size:11.5px;color:var(--muted)}
.overview-note{font-size:11.5px;color:var(--faint);margin-top:10px}

/* ─── EVENT CARDS ─── */
.event-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;
}
.event-head{
  padding:14px 16px;cursor:pointer;display:flex;align-items:flex-start;
  justify-content:space-between;gap:12px;transition:background .12s;
}
.event-head:hover{background:var(--bg)}
.event-name{font-size:14px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px;color:var(--ink)}
.event-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.event-meta .ico{margin-right:3px;opacity:.65}
.event-meta .ok{color:var(--green);font-weight:600}
.event-chevron{font-size:11px;color:var(--faint);transition:transform .18s;flex-shrink:0;margin-top:3px}
.event-card.open .event-chevron{transform:rotate(180deg)}
.event-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line-2)}
.event-card.open .event-body{display:block;padding-top:14px}
.event-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.event-col-title{
  font-size:10.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px;
}
.event-people{display:flex;flex-direction:column;gap:5px}
.event-people a,.event-people span{font-size:13px;color:var(--ink-2)}
.event-people a{color:var(--blue);cursor:pointer;text-decoration:none}
.event-people a:hover{text-decoration:underline}
.event-result{margin-top:16px}
.event-result-title{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.event-result p{font-size:13px;color:var(--ink-2);line-height:1.65;margin:0}
.event-case{
  margin-top:12px;background:var(--blue-lt);border:1px solid var(--blue-border);
  border-radius:var(--radius-sm);padding:12px 14px;
}
.event-case-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--blue);margin-bottom:6px}
.event-case p{font-size:13px;color:#1e3a8a;line-height:1.65;margin:0}
.event-year-tag{
  flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 9px;
  border-radius:5px;background:var(--purple-lt);color:var(--purple);white-space:nowrap;
}
.event-service-summary{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.event-service-box{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px}
.event-service-title{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.event-service-item{border-left:3px solid var(--line);padding:9px 11px;background:var(--panel);border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:7px 0}
.event-service-item.impact{border-left-color:var(--green);background:var(--green-lt)}
.event-service-company{font-weight:600;font-size:13px;color:var(--ink);margin-bottom:3px}
.event-service-desc{font-size:12.5px;color:var(--muted);line-height:1.55}

/* ─── SERVICE HEAT ─── */
.service-heat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:5px 0 8px}
.heat-dots{letter-spacing:2px;font-size:16px;line-height:1;color:#e5e7eb}
.heat-dots.high{color:var(--orange)}.heat-dots.medium{color:var(--blue-mid)}.heat-dots.low{color:var(--faint)}.heat-dots.none{color:#e5e7eb}
.service-meta{font-size:12px;color:var(--muted);margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}
.service-section{margin-top:14px}
.service-record{
  border-left:3px solid var(--line);background:var(--bg);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:11px 13px;margin:9px 0;
}
.service-record.impact{border-left-color:var(--green);background:var(--green-lt)}
.service-record-head{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;
}
.service-record-body{font-size:12.5px;color:var(--muted);line-height:1.6}

}

function extractYear(v){const m=String(v||'').match(/(20\d{2})/); return m?m[1]:''}

function serviceEventName(s){return get(s,['eventKey','activityName','2. 媒合會名稱','2. 展覽活動名稱','2. 論壇名稱','1. 授課主題'])}
function isServiceEventRelated(s){const item=String(s.serviceItem||s['服務項目 ']||s['服務項目']||''); return !!(s.isActivityRelated||item.includes('活動')||item.includes('課程'))}
function eventMatchKey(name,yr){return `${normalizeEventName(name)}::${String(yr||'')}`}
function normalizeEventName(v){return String(v||'').replace(/\s/g,'').replace(/[，,。．.、:：;；｜|()（）【】\[\]「」『』\-–—_]/g,'').toLowerCase()}
function serviceUniqueKey(s){return [s.company,s.date,s.timestamp,s.serviceItem,s.summary,s.eventKey||s.activityName].join('|')}
function recalcEventServiceStats(ev){const services=Array.isArray(ev.services)?ev.services:[]; const benefits=services.filter(s=>s.hasImpact); return {...ev,services,serviceCount:services.length,impactCount:benefits.length,hasImpact:!!(ev.hasImpact||benefits.length),participatingStartupCount:new Set(services.map(s=>s.company).filter(Boolean)).size,participatingStartupBenefits:benefits}}
function buildEventsWithServiceForms(events,services){
 // 乾淨規則：
 // 1) 2025 活動只顯示活動表本身，不顯示服務紀錄 / 成效追蹤。
 // 2) 服務表單只用「時間戳記」判斷年份，且只建立 / 掛載 2026 的活動服務紀錄。
 const out=events.map(ev=>{
  const evYear=String(ev.year||'');
  if(evYear!=='2026'){
   return {...ev,services:[],serviceCount:0,impactCount:0,hasImpact:!!ev.successCase,participatingStartupCount:0,participatingStartupBenefits:[]};
  }
  return recalcEventServiceStats({...ev,services:Array.isArray(ev.services)?[...ev.services]:[]});
 });
 const index={};
 out.forEach(ev=>{const k=eventMatchKey(ev.name,ev.year); if(ev.name&&ev.year&&!index[k])index[k]=ev});
 (services||[])
  .filter(s=>isServiceEventRelated(s)&&serviceEventYear(s)==='2026')
  .forEach(s=>{
   const name=serviceEventName(s); if(!name)return;
   const yr='2026';
   const k=eventMatchKey(name,yr);
   let ev=index[k];
   if(!ev){
    ev={name,date:s.timestamp||s.date||'',host:'',cohost:'',place:'',desc:'',attendCount:'',startupsList:[],partnersList:[],links:'',result:'',successCase:'',status:'表單服務紀錄',year:yr,services:[],serviceOnly:true,participatingStartupBenefits:[]};
    index[k]=ev; out.push(ev);
   }
   const seen=new Set((ev.services||[]).map(serviceUniqueKey));
   if(!seen.has(serviceUniqueKey(s))) ev.services.push(s);
  });
 return out.map(ev=>String(ev.year||'')==='2026'?recalcEventServiceStats(ev):ev);
}
function heatLevel(count){if(count>=5)return 'high'; if(count>=2)return 'medium'; if(count===1)return 'low'; return 'none'}
function heatDots(count){if(count>=5)return '● ● ●'; if(count>=2)return '● ● ○'; if(count===1)return '● ○ ○'; return '○ ○ ○'}

function serviceDateValue(record){
 const direct=Number(record&&record.dateValue)||0;
 if(direct)return direct;
 const d=parseDate((record&&record.date)||(record&&record.timestamp)||(record&&record['時間戳記'])||'');
 return d?d.getTime():0;
}
function recentServicedCompanies(days=90){
 const now=new Date();
 const since=new Date();
 since.setDate(now.getDate()-days);
 const pool=[...data.startups,...data.alumni];
 return pool.map(company=>{
  const services=(company.services||[])
   .map(service=>({...service,_time:serviceDateValue(service)}))
   .filter(service=>service._time>=since.getTime()&&service._time<=now.getTime())
   .sort((a,b)=>b._time-a._time);
  if(!services.length)return null;
  return {...company,recentServiceCount:services.length,recentServiceDate:services[0].date||services[0].timestamp||''};
 }).filter(Boolean).sort((a,b)=>{
  const at=(a.services||[]).reduce((max,svc)=>Math.max(max,serviceDateValue(svc)),0);
  const bt=(b.services||[]).reduce((max,svc)=>Math.max(max,serviceDateValue(svc)),0);
  return bt-at;
 }).slice(0,8);
}

function bars(obj,kind){const entries=Object.entries(obj).sort((a,b)=>b[1]-a[1]); const total=entries.reduce((s,x)=>s+x[1],0)||1; return entries.map(([k,v])=>`<div class="bar-row"><div>${esc(k)}</div><div class="bar-bg"><div class="bar-fill" style="width:${v/total*100}%"></div></div><div>${Math.round(v/total*100)}%</div></div>`).join('')||'<div class="empty">目前無資料</div>'}
function yearBars(obj){const entries=Object.entries(obj).sort((a,b)=>a[0].localeCompare(b[0])); if(!entries.length)return '<div class="empty">目前無資料</div>'; const max=Math.max(...entries.map(x=>x[1]),1); return `<div class="yr-chart">${entries.map(([y,v])=>`<div class="yr-col"><div class="yr-num">${v}</div><div class="yr-bar" style="height:${Math.round(v/max*120)}px"></div><div class="yr-lbl">${esc(y)}</div></div>`).join('')}</div>`}

function parseEventDate(d){
 const s=String(d||'').trim();
 if(!s)return null;
 let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 if(m)return new Date(+m[3],+m[1]-1,+m[2]);
 m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
 if(m)return new Date(+m[1],+m[2]-1,+m[3]);
 const t=new Date(s);
 return isNaN(t)?null:t;
}

function openDetail(name,type='startups'){const item=(data[type]||[]).find(x=>x.name===name)||data.startups.find(x=>x.name===name)||data.alumni.find(x=>x.name===name); if(!item)return; currentExport={page:'detail',title:item.name,rows:[item]}; document.querySelectorAll('.page').forEach(x=>x.classList.remove('active')); const d=document.getElementById('detail'); d.classList.add('active'); const basic=[...(type==='alumni'?[['主責經理',item.manager||item['主責經理']||item.founder]]:[]),['負責人',item.founder],['負責人職稱',item.title],['成立年份',item.startYear],['畢業年份',item.graduateYear&&item.graduateYear!=='—'?item.graduateYear:''],['合約起日',item.contractStartText],['合約迄日',item.contractEndText],['統一編號',item['統一編號']],['公司電話',item['公司電話']],['Email',item['負責人連絡信箱']||item['電子郵件']||item['Email']],['地址',item['聯絡地址']||item['登記地址']]].filter(x=>x[1]); const similar=getSimilarStartups(item,5); d.innerHTML=`<button class="back" onclick="showPage('${type}')">← 返回</button><div class="card detail-hero"><div><div class="detail-title">${esc(item.name)}</div>${serviceBadges(item)}${tagHtml(item)}${serviceMeta(item)}</div><div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">${emailButtonHtml(item,item._type||type)}<button class="edit" onclick="editData()">更新資料</button></div></div><div class="detail-grid"><div class="card p16"><h3>公司內容</h3><div class="kv"><b>公司簡介</b><div>${esc(item.desc||'暫無簡介描述。')}</div></div><div class="kv"><b>產品與服務</b><div>${esc(item.product||'尚未提供')}</div></div><div class="kv"><b>主要應用場景</b><div>${esc(item.scenario||'尚未提供')}</div></div><div class="kv"><b>目標市場</b><div>${(item.targetTags&&item.targetTags.length)?`<div class="tags">${item.targetTags.map(t=>`<span class="tag market">${esc(t)}</span>`).join('')}</div>`:esc(item.target||'尚未提供')}</div></div></div><div class="card p16"><h3>基本資料</h3>${basic.map(([k,v])=>`<div class="kv"><b>${esc(k)}</b><div>${esc(v)}</div></div>`).join('')||'<div class="empty">無基本資料</div>'}</div></div><div class="card p16 service-section"><h3>服務紀錄（合約區間內）</h3>${serviceTimelineHtml(item.services)}</div><div class="card p16 section"><h3>更多相似新創</h3>${similar.length?`<div class="similar-grid">${similar.map(x=>`<div class="similar-card" onclick='openDetail(${JSON.stringify(x.s.name)},${JSON.stringify(x.s._type||'startups')})'><div class="sim-name">${esc(x.s.name)}</div><div class="tags">${x.common.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="sim-score">相同標籤 ${x.common.length} 個</div></div>`).join('')}</div>`:'<div class="empty">目前沒有相似新創</div>'}</div>`}
function getSimilarStartups(item,limit=5){const pool=[...data.startups,...data.alumni].filter(s=>s.name!==item.name); const base=new Set(item.industryTags||[]); return pool.map(s=>{const common=(s.industryTags||[]).filter(t=>base.has(t)); return {s,common,score:common.length}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||String(a.s.name).localeCompare(b.s.name,'zh-Hant')).slice(0,limit)}
function getPartnerMatches(p,limit=5){
 const text=[p.name,p.note,p.source,p.reason,p['產業領域'],p['需求描述'],p['希望合作主題']].filter(Boolean).join(' ').toLowerCase();
 return data.startups.map(s=>{
  let score=0; const reasons=[];
  const tagHits=(s.industryTags||[]).filter(t=>text.includes(t.toLowerCase()));
  if(tagHits.length){score+=tagHits.length*20; reasons.push(tagHits.join('、'))}
  const blob=[s.desc,s.product,s.scenario].filter(Boolean).join(' ');
  reasons.push(blob.slice(0,40)+(blob.length>40?'…':''));
  if(score===0 && (s.industryTags||[]).length) score=10;
  return {s,score:Math.min(95,score),reason:reasons.filter(Boolean).join(' — ')};
 }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,limit);
}
function openPartnerDetail(name){
 const p=data.partners.find(x=>x.name===name);
 if(!p)return;
 document.querySelectorAll('.page,.detail').forEach(x=>x.classList.remove('active'));
 const d=document.getElementById('detail'); d.classList.add('active');
 const matches=getPartnerMatches(p);
 d.innerHTML=`<button class="back" onclick="showPage('partners')">← 返回列表</button>
 <div class="card detail-hero">
  <div class="partner-hero"><div class="partner-avatar">P</div><div><div class="detail-title">${esc(p.name)}</div><div class="tags"><span class="tag">${esc(p.type||'其他')}</span><span class="tag market">${esc(p.status||'待分類')}</span></div></div></div>
 </div>
 <div class="detail-grid">
  <div class="card p16">
   <h3>合作資訊</h3>
   <div class="kv"><b>需求描述</b><div>${esc(p['需求描述']||p.note||'尚未提供')}</div></div>
   <div class="kv"><b>希望合作主題</b><div>${esc(p['希望合作主題']||p.reason||'尚未提供')}</div></div>
   <div class="kv"><b>產業領域</b><div>${esc(p['產業領域']||p.source||'尚未提供')}</div></div>
   <div class="kv"><b>備註</b><div>${esc(p.note||'尚未提供')}</div></div>
  </div>
  <div class="card p16 detail-side">
   <h3>聯絡資訊</h3>
   <div class="kv"><b>聯絡窗口</b><div>${esc(p.contact||'—')}</div></div>
   <div class="kv"><b>聯絡方式</b><div>${esc(p.email||p.phone||'—')}</div></div>
   <div class="kv"><b>合作狀態</b><div>${esc(p.status||'待分類')}</div></div>
  </div>
 </div>
 <div class="card p16 section">
  <h3>適配度分析 — 推薦新創</h3>
  ${matches.length?`<table class="adapt-table"><thead><tr><th>推薦新創</th><th>技術能力 / 匹配原因</th><th style="text-align:right">適配度</th></tr></thead><tbody>${matches.map(m=>`<tr><td><span class="adapt-name" onclick='openDetail(${JSON.stringify(m.s.name)},${JSON.stringify(m.s._type||'startups')})'>${esc(m.s.name)}</span></td><td>${esc(m.reason)}</td><td class="adapt-score">${m.score}%</td></tr>`).join('')}</tbody></table>`:'<div class="empty">目前沒有明顯匹配的新創，建議補充需求描述或合作主題。</div>'}
 </div>`;
}
function showServiceStartups(){showPage('startups'); setTimeout(()=>{document.getElementById('q-startups').value=''; renderStartupView('startups',data.startups.filter(s=>Number(s.serviceCount)>0));},0)}
function showImpactStartups(){showPage('startups'); setTimeout(()=>{document.getElementById('q-startups').value=''; renderStartupView('startups',data.startups.filter(s=>s.hasImpact));},0)}
function filterByTag(tag){showPage('startups'); setTimeout(()=>{document.querySelectorAll('#multi-ind-startups input').forEach(x=>x.checked=x.value===tag); applyFilters('startups')},0)}
function toggleMulti(id){document.querySelectorAll('.multi').forEach(m=>{if(m.id!==id)m.classList.remove('open')});document.getElementById(id).classList.toggle('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.multi'))document.querySelectorAll('.multi').forEach(m=>m.classList.remove('open'))})
function editData(){alert('本測試版使用本機 Excel 快照。請更新來源 Excel 後重新產生 data/snapshot.json；此版本不會更動正式 Google Sheet 或 API。')}
function globalSearch(){const q=document.getElementById('globalSearch').value.toLowerCase(); if(!q)return; showPage('startups'); setTimeout(()=>{document.getElementById('q-startups').value=q; applyFilters('startups')},0)}
loadAll();
